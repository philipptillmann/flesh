name: Checks
on:
  push:
    branches: [server]
  pull_request:
    branches: [server]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m py_compile server.py ops.py
      - run: bash -n update.sh
      - run: node --check public/app.js && node --check public/crypto.js && node --check public/sw.js
      - run: node --test tests/*.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: docker compose config --quiet
      - run: docker build -t flesh-check .
