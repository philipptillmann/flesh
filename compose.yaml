name: flesh
services:
  health:
    image: flesh-server:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8083}
    volumes:
      - health-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  health-data:
