name: flesh
services:
  health:
    image: flesh-server:local
    build: .
    restart: unless-stopped
    ports:
      - target: 8080
        published: "${FLESH_PORT:-8083}"
        host_ip: "${FLESH_BIND:-127.0.0.1}"
        protocol: tcp
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${FLESH_PORT:-8083}}
      FLESH_ALLOW_REGISTRATION: "${FLESH_ALLOW_REGISTRATION:-false}"
    volumes:
      - health-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  health-data:
